<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ServiceSnap | Log In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="navbar">
  <div class="logo">
    ServiceSnap <small class="byName">by Akshat Bellure</small>
  </div>
  <nav id="navLinks"></nav>
  <div class="header-right">
    <button class="sos-btn" onclick="triggerSOS()">SOS</button>
    <span id="userGreeting"></span>
  </div>
</header>

<section class="page-content login-container">
  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required />
    <input type="password" id="loginPassword" placeholder="Password" required />
    <button type="submit">Log In</button>
  </form>
  <p>Not registered? <a href="signup.html">Create an account</a></p>
  <div id="loginResult"></div>
</section>

<footer>
  <p>© 2025 ServiceSnap. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
