<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ServiceSnap | Reviews</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="navbar">
  <div class="logo">
    ServiceSnap <small class="byName">by Akshat Bellure</small>
  </div>
  <nav id="navLinks"></nav>
  <div class="header-right">
    <button class="sos-btn" onclick="triggerSOS()">SOS</button>
    <span id="userGreeting"></span>
  </div>
</header>

<section class="page-content">
  <h1>Customer Reviews</h1>
  <p>
    Completed bookings with ratings appear here. 
    If repeated scamming is found or rating falls too low, 
    the provider may be <strong>delisted</strong>.
  </p>
  <div id="reviewsContainer" class="testimonial-grid">
    <!-- Dynamically loaded from script.js -->
  </div>
</section>

<footer>
  <p>© 2025 ServiceSnap. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
