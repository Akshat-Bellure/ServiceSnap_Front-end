<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ServiceSnap | Sign Up</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="navbar">
  <div class="logo">
    ServiceSnap <small class="byName">by Akshat Bellure</small>
  </div>
  <nav id="navLinks"></nav>
  <div class="header-right">
    <button class="sos-btn" onclick="triggerSOS()">SOS</button>
    <span id="userGreeting"></span>
  </div>
</header>

<section class="page-content signup-container">
  <h2>Sign Up</h2>
  <p>If you're a <strong>Provider</strong>, we need more details like languages, KYC, etc.</p>
  <form id="signupForm">
    <input type="text" id="signupName" placeholder="Full Name" required />
    <input type="email" id="signupEmail" placeholder="Email" required />
    <input type="password" id="signupPassword" placeholder="Password" required />

    <label for="signupPhone">Phone Number</label>
    <input type="text" id="signupPhone" placeholder="Your Phone" required />

    <!-- Country, languages for the eCard -->
    <label for="signupCountry">Country</label>
    <input type="text" id="signupCountry" placeholder="e.g. India" required />

    <label for="signupLanguages">Languages (comma-separated)</label>
    <input type="text" id="signupLanguages" placeholder="e.g. English, Hindi" />

    <!-- 3-step location with only "Karnataka -> Bangalore" active -->
    <label for="signupState">State</label>
    <select id="signupState" required>
      <option value="">-- Select State --</option>
      <option>Karnataka</option>
      <option>Maharashtra</option>
      <option>Tamil Nadu</option>
      <option>Kerala</option>
      <option>Andhra Pradesh</option>
      <option>Telangana</option>
      <option>Gujarat</option>
      <option>Rajasthan</option>
    </select>

    <label for="signupDistrict">District</label>
    <select id="signupDistrict" required>
      <option value="">-- Select District --</option>
    </select>

    <label for="signupArea">Area</label>
    <select id="signupArea" required>
      <option value="">-- Select Area --</option>
    </select>

    <div class="user-type">
      <label>
        <input type="radio" name="role" value="provider" required />
        Provider
      </label>
      <label>
        <input type="radio" name="role" value="customer" required />
        Customer
      </label>
    </div>

    <button type="submit">Sign Up</button>
  </form>
  <p>Already have an account? <a href="login.html">Log in here</a></p>
  <div id="signupResult"></div>
</section>

<footer>
  <p>© 2025 ServiceSnap. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
