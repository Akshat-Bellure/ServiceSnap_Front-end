<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ServiceSnap | Book Service</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="navbar">
  <div class="logo">
    ServiceSnap <small class="byName">by Akshat Bellure</small>
  </div>
  <nav id="navLinks"></nav>
  <div class="header-right">
    <button class="sos-btn" onclick="triggerSOS()">SOS</button>
    <span id="userGreeting"></span>
  </div>
</header>

<section class="page-content">
  <h1>Book a Service</h1>
  <p>
    Select a category, subcategory, attach images if needed, then schedule. 
    Our <strong>AI</strong> will auto-match you with the <strong>nearest</strong> provider 
    in your chosen category.
  </p>

  <div class="service-form">
    <label for="mainCategory">Category:</label>
    <select id="mainCategory">
      <option value="">-- Select Category --</option>
      <option>Electrician</option>
      <option>Plumber</option>
      <option>House Cleaner</option>
      <option>Mover</option>
      <option>Carpenter</option>
    </select>

    <label for="subCategory">Subcategory (Optional):</label>
    <select id="subCategory"></select>

    <label for="bookingImages">Attach Images/Videos (optional):</label>
    <input type="file" id="bookingImages" accept="image/*,video/*" multiple />

    <label for="dateTime">Preferred Date/Time:</label>
    <input type="datetime-local" id="dateTime" />

    <button onclick="bookService()">Submit Booking</button>
    <div id="bookingResult"></div>
  </div>
</section>

<footer>
  <p>© 2025 ServiceSnap. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
